aid: kuaidian-reading
name: Kuaidian Reading
description: 'Kuaidian Reading (快点阅读) is a Chinese mobile reading community operated by Beijing
  Tiantong Interactive Technology Co., Ltd. (Sky Platanus Interactive, 天桐互动), positioning itself
  as China''s first dialogue-based reading app. Instead of long-form web fiction, the platform
  publishes chat-style novels rendered as character dialogue, which it argues gives clearer
  characterization, tighter pacing and stronger reader immersion. Content is user-generated at
  scale — the company claims over 20,000 new novels uploaded daily — and distributed through a
  decentralized recommendation algorithm rather than editorial merchandising. Social mechanics
  include barrage-style inline comments, author tipping, and a co-writing mode that lowers the
  barrier for first-time writers. Authors work in a separate creation console at
  editor.kuaidianyuedu.com. The company was surfaced as a portfolio company of DCM Ventures.
  As of this enrichment pass Kuaidian Reading publishes no public API, SDK, developer portal, or
  /.well-known/ discovery surface; it is a consumer-app company with no developer-facing program.'
